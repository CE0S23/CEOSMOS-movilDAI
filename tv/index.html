<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://firestore.googleapis.com https://firebaseinstallations.googleapis.com https://www.gstatic.com; media-src 'self' https:; img-src 'self' data: https:; script-src 'self' https://www.gstatic.com" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>CEOSMOS TV</title>
</head>
<body>
  <div id="fondo-media" aria-hidden="true"></div>

  <div id="app" class="safe-zone">
    <header class="app-header">
      <div class="app-header__brand">
        <h1 class="app-header__title">CEOSMOS</h1>
        <p class="app-header__subtitle">Concentración · Relajación</p>
      </div>
      <div class="app-header__reloj">
        <span id="reloj-hora" class="dato-principal">--:--</span>
        <span id="reloj-fecha" class="etiqueta-secundaria">-------</span>
      </div>
    </header>

    <main class="grid-contenidos"></main>
  </div>

  <div id="vinculacion" class="vinculacion" hidden>
    <form id="vinculacion-form" class="vinculacion__form">
      <h1 class="vinculacion__titulo">Vincular Smart TV</h1>
      <p class="vinculacion__texto">
        Ingresa el email y el código de vinculación que muestra la app CEOSMOS en tu teléfono.
      </p>

      <label class="vinculacion__campo">
        <span class="vinculacion__etiqueta">Email</span>
        <input
          id="vinculacion-email"
          class="vinculacion__entrada"
          type="email"
          autocomplete="off"
          placeholder="usuario@correo.com"
        />
      </label>

      <label class="vinculacion__campo">
        <span class="vinculacion__etiqueta">Código de 6 dígitos</span>
        <input
          id="vinculacion-codigo"
          class="vinculacion__entrada vinculacion__entrada--codigo"
          type="text"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          autocomplete="off"
          placeholder="000000"
        />
      </label>

      <p id="vinculacion-error" class="vinculacion__error" hidden></p>

      <button type="submit" class="vinculacion__boton">Vincular</button>
    </form>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
